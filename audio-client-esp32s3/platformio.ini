[platformio]
default_envs = freenove_esp32_s3_wroom

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_type = release
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
extra_scripts = post:flash_model.py
build_flags =
  -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
  -DENABLE_WIFI=0
  -DDEVICE_ID='"esp32s3-room01"'
  -DWIFI_SSID='"Thanh Hai"'
  -DWIFI_PASS='"thanhhai30032000"'
  -DSERVER_URL='"ws://103.75.183.34:8000/ws/audio"'
  -DSAMPLE_RATE=16000
  -DCHANNELS=1
  -DBITS_PER_SAMPLE=16
  -DAUDIO_FORMAT='"pcm_s16le"'
  -DMIC_BCLK_PIN=14
  -DMIC_WS_PIN=15
  -DMIC_SD_PIN=16
  -DOLED_ENABLE=1
  -DOLED_SDA_PIN=8
  -DOLED_SCL_PIN=9
  -DOLED_I2C_ADDR=0x3C
  -DOLED_DRIVER_SH1106=1
  -DOLED_COLUMN_OFFSET=2
